<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課堂文字雲</title>
<style>
  body { font-family: system-ui, "Noto Sans TC", sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; line-height: 1.6; }
  input, button { font-size: 16px; padding: 10px; margin-top: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
  input { width: 100%; }
  button { background: #1a73e8; color: #fff; border: 0; cursor: pointer; padding: 10px 18px; margin-right: 8px; }
  button:disabled { opacity: .5; cursor: wait; }
  #status { min-height: 1.5em; color: #1a7f37; }
  #cloud { margin-top: 12px; line-height: 2.2; }
  #cloud span { display: inline-block; margin: 2px 6px; padding: 2px 10px; background: #e8f0fe; border-radius: 16px; }
  .meta { color: #888; font-size: 12px; }
</style>
</head>
<body>
<h2>課堂文字雲</h2>
<input id="seat" placeholder="座號（例：5）" maxlength="10">
<input id="word" placeholder="一個詞（例：開心）" maxlength="20">
<div>
  <button id="send">送出</button>
  <button id="toggle">隱藏文字雲</button>
</div>
<p id="status"></p>
<h3>大家的詞（<span id="count">0</span>）</h3>
<div id="cloud"></div>
<p class="meta">只收座號＋詞彙，不收姓名。送出的詞會即時出現在全班畫面上。</p>
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
  const supabase = createClient(
    'https://sdqwefnuwlzxsrdptmyj.supabase.co',
    'sb_publishable_mHe-hKBM7PkBvSiiW3ew_A_cCBH-Ojv'
  )
  const $ = (id) => document.getElementById(id)
  const show = (t) => { $('status').textContent = t }
  const freq = {}
  function draw() {
    const cloud = $('cloud'); cloud.innerHTML = ''
    const entries = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 60)
    let total = 0
    entries.forEach(([w, n]) => {
      total += n
      const s = document.createElement('span')
      s.style.fontSize = (14 + Math.min(n, 8) * 3) + 'px'
      s.textContent = w + (n > 1 ? ' ×' + n : '')
      cloud.appendChild(s)
    })
    $('count').textContent = total
  }
  function addWord(w) { freq[w] = (freq[w] || 0) + 1; draw() }
  async function load() {
    const { data, error } = await supabase.from('wordcloud').select('word').order('created_at', { ascending: false }).limit(500)
    if (error) { show('讀取失敗：' + error.message); return }
    data.forEach(r => addWord(r.word))
  }
  async function send() {
    const seat = $('seat').value.trim().slice(0, 10)
    const word = $('word').value.trim().slice(0, 20)
    if (!word) { show('請輸入一個詞'); return }
    $('send').disabled = true; show('送出中…')
    const { error } = await supabase.from('wordcloud').insert({ seat_no: seat || '匿名', word })
    $('send').disabled = false
    if (error) { show('送出失敗：' + error.message); return }
    $('word').value = ''; show('已送出')
  }
  $('send').addEventListener('click', send)
  $('toggle').addEventListener('click', () => {
    const c = $('cloud')
    const hidden = c.style.display === 'none'
    c.style.display = hidden ? '' : 'none'
    $('toggle').textContent = hidden ? '隱藏文字雲' : '顯示文字雲'
  })
  supabase.channel('wordcloud-live')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'wordcloud' }, (payload) => { addWord(payload.new.word) })
    .subscribe()
  load()
</script>
</body>
</html>
